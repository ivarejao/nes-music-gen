name: nesmdb
services:
    api:
        build: .
        tty: true
        stdin_open: true
        ports:
            - 5555:5555
        volumes:
            - ./app.py:/app/app.py # for dev
            - $DATA_MOUNT_POINT:/data
        environment:
            - DATA_MOUNT_POINT
        # NOTE: Hardcoded for augmentation g15
        deploy:
            resources:
                limits:
                    cpus: "8"