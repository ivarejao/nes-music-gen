name: nesmdb
services:
    api:
        build: .
        tty: true
        stdin_open: true
        ports:
            - 5555:5555
        volumes:
            - ./app.py:/app/app.py # for dev
            - $DATA_MOUNT_POINT:/data
            # - /home/igor/Desktop/Repos/nes-music-gen/nesmdb/interactive/nesmdb:/workspace/nesmdb
        environment:
            - DATA_MOUNT_POINT